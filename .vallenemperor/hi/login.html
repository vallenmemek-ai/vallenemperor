<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vallen Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e2e8f0;
  }

  .card {
    background: #111118;
    border: 1px solid #1e1e2e;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 0 60px rgba(99, 102, 241, 0.08);
  }

  .logo {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 10px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #f1f5f9;
  }

  .sub {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 32px;
  }

  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
    font-weight: 500;
  }

  input {
    width: 100%;
    background: #0d0d14;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
    color: #e2e8f0;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: #6366f1; }
  input::placeholder { color: #334155; }

  .forgot {
    display: flex;
    justify-content: flex-end;
    margin-top: 6px;
  }

  .forgot a {
    font-size: 12px;
    color: #6366f1;
    text-decoration: none;
  }

  .forgot a:hover { text-decoration: underline; }

  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  button:hover { opacity: 0.88; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: #334155;
    font-size: 12px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #1e1e2e;
  }

  .btn-google {
    background: #0d0d14;
    border: 1px solid #1e1e2e;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 500;
    margin-top: 0;
  }

  .btn-google:hover { background: #111118; opacity: 1; border-color: #334155; }
  .btn-google svg { width: 18px; height: 18px; }

  .signup {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: #64748b;
  }

  .signup a {
    color: #6366f1;
    text-decoration: none;
    font-weight: 500;
  }

  .signup a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"></div>
  <p style="font-size:13px;color:#6366f1;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;">Vallen Login Test</p>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to your account</p>

  <form onsubmit="return false">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="pass">Password</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
      <div class="forgot"><a href="#">Forgot password?</a></div>
    </div>
    <button type="submit">Sign in</button>
  </form>

  <div class="divider">or</div>

  <button class="btn-google" type="button">
    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.3 0 24 0 14.7 0 6.8 5.4 2.9 13.3l7.8 6C12.5 13 17.9 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8C43.6 37.4 46.5 31.4 46.5 24.5z"/>
      <path fill="#FBBC05" d="M10.7 28.3A14.6 14.6 0 0 1 10 24c0-1.5.3-2.9.7-4.3l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.9 10.7l7.8-6.4z"/>
      <path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.5-5.8c-2.1 1.4-4.8 2.3-8 2.3-6.1 0-11.4-4.1-13.3-9.6l-7.8 6.4C6.8 42.6 14.7 48 24 48z"/>
    </svg>
    Continue with Google
  </button>

  <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
</div>
</body>
</html>

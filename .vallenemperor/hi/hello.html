<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vallen Ganteng</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #888;
    --accent: #0070f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; padding: 2rem; }
  h1 {
    margin: 0 0 .5rem;
    font-size: clamp(2.5rem, 10vw, 5rem);
    letter-spacing: -.04em;
    line-height: 1;
    background: linear-gradient(180deg, #fff 40%, var(--muted));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin: 0; color: var(--muted); font-size: 1rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Vallen Ganteng</h1>
  <p>test cli by vallen</p>
  <p><a href="test-cli.html">→ vallencli test report</a></p>
</main>
</body>
</html>
